name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++

      - name: Configure
        run: cmake -S server -B server/build

      - name: Build
        run: cmake --build server/build -j

      - name: Run tests
        working-directory: server/build
        run: |
          ./test_dijkstra
          ./test_domain
          ./test_simulation
